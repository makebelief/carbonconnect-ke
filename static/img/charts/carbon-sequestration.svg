<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="400" height="250" fill="#ffffff"/>
    
    <!-- Pie Chart -->
    <g transform="translate(150, 125)">
        <!-- Agroforestry 45% -->
        <path d="M 0 0 L 80 0 A 80 80 0 0 1 -56.57 56.57 Z" fill="#2ecc71"/>
        <!-- Reforestation 30% -->
        <path d="M 0 0 L -56.57 56.57 A 80 80 0 0 1 -80 0 Z" fill="#27ae60"/>
        <!-- Conservation Agriculture 15% -->
        <path d="M 0 0 L -80 0 A 80 80 0 0 1 -56.57 -56.57 Z" fill="#3498db"/>
        <!-- Soil Carbon 10% -->
        <path d="M 0 0 L -56.57 -56.57 A 80 80 0 0 1 0 -80 L 0 0 Z" fill="#95a5a6"/>
    </g>
    
    <!-- Legend -->
    <g transform="translate(280, 60)">
        <rect x="0" y="0" width="16" height="16" fill="#2ecc71"/>
        <text x="24" y="12" font-family="Arial" font-size="12">Agroforestry (45%)</text>
        
        <rect x="0" y="25" width="16" height="16" fill="#27ae60"/>
        <text x="24" y="37" font-family="Arial" font-size="12">Reforestation (30%)</text>
        
        <rect x="0" y="50" width="16" height="16" fill="#3498db"/>
        <text x="24" y="62" font-family="Arial" font-size="12">Conservation (15%)</text>
        
        <rect x="0" y="75" width="16" height="16" fill="#95a5a6"/>
        <text x="24" y="87" font-family="Arial" font-size="12">Soil Carbon (10%)</text>
    </g>
</svg> 