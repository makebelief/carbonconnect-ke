<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="400" height="250" fill="#ffffff"/>
    
    <!-- Radar Chart -->
    <g transform="translate(150, 125)">
        <!-- Background Polygons -->
        <polygon points="0,-80 69.28,-40 69.28,40 0,80 -69.28,40 -69.28,-40" 
                 fill="none" stroke="#e6e6e6"/>
        <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" 
                 fill="none" stroke="#e6e6e6"/>
        <polygon points="0,-40 34.64,-20 34.64,20 0,40 -34.64,20 -34.64,-20" 
                 fill="none" stroke="#e6e6e6"/>
        <polygon points="0,-20 17.32,-10 17.32,10 0,20 -17.32,10 -17.32,-10" 
                 fill="none" stroke="#e6e6e6"/>
                 
        <!-- Data Polygon -->
        <polygon points="0,-72 62.35,-36 62.35,36 0,64 -62.35,36 -62.35,-36" 
                 fill="#2ecc7155" stroke="#2ecc71" stroke-width="2"/>
                 
        <!-- Axes -->
        <line x1="0" y1="0" x2="0" y2="-80" stroke="#666"/>
        <line x1="0" y1="0" x2="69.28" y2="-40" stroke="#666"/>
        <line x1="0" y1="0" x2="69.28" y2="40" stroke="#666"/>
        <line x1="0" y1="0" x2="0" y2="80" stroke="#666"/>
        <line x1="0" y1="0" x2="-69.28" y2="40" stroke="#666"/>
        <line x1="0" y1="0" x2="-69.28" y2="-40" stroke="#666"/>
    </g>
    
    <!-- Labels -->
    <g font-family="Arial" font-size="10" text-anchor="middle">
        <text x="150" y="30">Income Growth</text>
        <text x="230" y="70">Skills Development</text>
        <text x="230" y="180">Food Security</text>
        <text x="150" y="220">Environmental Impact</text>
        <text x="70" y="180">Health Benefits</text>
        <text x="70" y="70">Community Engagement</text>
    </g>
    
    <!-- Legend -->
    <g transform="translate(300, 110)">
        <rect x="0" y="0" width="15" height="15" fill="#2ecc7155" stroke="#2ecc71"/>
        <text x="25" y="12" font-family="Arial" font-size="11">Target Impact Score</text>
    </g>
</svg> 