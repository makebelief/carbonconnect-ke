<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="400" height="250" fill="#ffffff"/>
    
    <!-- Grid -->
    <g stroke="#e6e6e6" stroke-width="1">
        <line x1="50" y1="50" x2="350" y2="50"/>
        <line x1="50" y1="100" x2="350" y2="100"/>
        <line x1="50" y1="150" x2="350" y2="150"/>
        <line x1="50" y1="200" x2="350" y2="200"/>
    </g>
    
    <!-- Axes -->
    <line x1="50" y1="200" x2="350" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="50" y1="50" x2="50" y2="200" stroke="#333" stroke-width="2"/>
    
    <!-- Trees Planted Line -->
    <path d="M 80 160 L 140 140 L 200 110 L 260 80 L 320 60" 
          fill="none" stroke="#2ecc71" stroke-width="3"/>
    
    <!-- CO₂ Sequestered Line -->
    <path d="M 80 180 L 140 150 L 200 120 L 260 90 L 320 70" 
          fill="none" stroke="#3498db" stroke-width="3"/>
    
    <!-- Year Labels -->
    <g font-family="Arial" font-size="11" text-anchor="middle">
        <text x="80" y="220">2024</text>
        <text x="140" y="220">2025</text>
        <text x="200" y="220">2026</text>
        <text x="260" y="220">2027</text>
        <text x="320" y="220">2028</text>
    </g>
    
    <!-- Legend -->
    <g transform="translate(250, 30)">
        <line x1="0" y1="0" x2="15" y2="0" stroke="#2ecc71" stroke-width="3"/>
        <text x="25" y="4" font-family="Arial" font-size="11">Trees Planted</text>
        
        <line x1="0" y1="20" x2="15" y2="20" stroke="#3498db" stroke-width="3"/>
        <text x="25" y="24" font-family="Arial" font-size="11">CO₂ Sequestered</text>
    </g>
</svg> 