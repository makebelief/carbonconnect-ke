<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Forbidden | CarbonConnect Kenya</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
            padding: 2rem;
        }
        
        .error-icon {
            font-size: 6rem;
            color: var(--danger-color);
            margin-bottom: 2rem;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .error-code {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 1rem;
            letter-spacing: -1px;
        }
        
        .error-message {
            font-size: 1.5rem;
            color: var(--text-color);
            margin-bottom: 2rem;
        }
        
        .error-details {
            color: var(--text-light);
            margin-bottom: 2rem;
            max-width: 600px;
        }
        
        .action-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <img src="/static/img/logo.png" alt="CarbonConnect Logo">
                <h1>CarbonConnect<span>Kenya</span></h1>
            </div>
        </header>

        <main class="main-content">
            <div class="error-container">
                <div class="error-icon">
                    <i class="fas fa-lock"></i>
                </div>
                <h1 class="error-code">403</h1>
                <h2 class="error-message">Access Forbidden</h2>
                <p class="error-details">
                    Sorry, you don't have permission to access this page. 
                    This might be because you need to log in or your account doesn't have the necessary permissions.
                </p>
                <div class="action-buttons">
                    <a href="/" class="primary-btn"><i class="fas fa-home"></i> Back to Home</a>
                    <a href="/login" class="secondary-btn"><i class="fas fa-sign-in-alt"></i> Log In</a>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            <p>&copy; 2025 CarbonConnect Kenya | Empowering smallholder farmers in the carbon market</p>
        </footer>
    </div>
</body>
</html>
